<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2 class="mb-4" th:text="${user.id} == null ? 'Add New User' : 'Edit User'">User Form</h2>

    <!-- Add User -->
    <form th:if="${user.id} == null" th:action="@{/admin-panel/users/save}" th:object="${user}" method="post">
        <div class="mb-3">
            <label class="form-label">Username:</label>
            <input type="text" th:field="*{username}" class="form-control" required />
            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Full Name:</label>
            <input type="text" th:field="*{fullName}" class="form-control" required />
            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Role:</label>
            <select th:field="*{role}" class="form-select" required>
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password:</label>
            <input type="password" th:field="*{password}" class="form-control" required />
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-success">Add</button>
        <a th:href="@{/admin-panel/users}" class="btn btn-secondary ms-2">Cancel</a>
    </form>

    <!-- Edit User -->
    <form th:if="${user.id} != null" th:action="@{/admin-panel/users/save}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label class="form-label">Username:</label>
            <input type="text" th:field="*{username}" class="form-control" required />
            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Full Name:</label>
            <input type="text" th:field="*{fullName}" class="form-control" required />
            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Role:</label>
            <select th:field="*{role}" class="form-select" required>
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"
                        th:selected="${user.role} == ${role}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">New Password:</label>
            <input type="password" th:field="*{password}" placeholder="Enter new password" class="form-control" />
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
        <a th:href="@{/admin-panel/users}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
</body>
</html>
