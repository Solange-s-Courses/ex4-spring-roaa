<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
</head>
<body>

<h2 th:text="${user.id} == null ? 'Add New User' : 'Edit User'">User Form</h2>

<!-- Add User -->
<form th:if="${user.id} == null" th:action="@{/admin-panel/users/save}" th:object="${user}" method="post">

    <div>
        <label>Username:</label>
        <input type="text" th:field="*{username}" required />
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>

    <div>
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" required />
        <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div>
        <label>Role:</label>
        <select th:field="*{role}" required>
            <option th:each="role : ${roles}"
                    th:value="${role}"
                    th:text="${role}">
            </option>
        </select>
        <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
    </div>

    <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}" required />
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <button type="submit">Add</button>
    <a th:href="@{/admin/users}">Cancel</a>
</form>

<!-- Edit User -->
<form th:if="${user.id} != null" th:action="@{/admin-panel/users/save}" th:object="${user}" method="post">

    <div>
        <label>Username:</label>
        <input type="text" th:field="*{username}" required />
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>

    <div>
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" required />
        <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div>
        <label>Role:</label>
        <select th:field="*{role}" required>
            <option th:each="role : ${roles}"
                    th:value="${role}"
                    th:text="${role}"
                    th:selected="${user.role} == ${role}">
            </option>
        </select>
        <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
    </div>

    <div>
        <label>New Password:</label>
        <input type="password" th:field="*{password}" placeholder="Enter new password" />
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <button type="submit">Update</button>
    <a th:href="@{/admin/users}">Cancel</a>
</form>

</body>
</html>
