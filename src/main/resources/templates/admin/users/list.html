<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<h2>All Users</h2>

<a th:href="@{/admin/users/new}">Add New User</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Full Name</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.username}">john</td>
        <td th:text="${user.fullName}">John Doe</td>
        <td th:text="${user.role}">STUDENT</td>
        <td>
            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}">Edit</a> |
            <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
               onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
