<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>


<div class="container mt-4">
    <h2 class="mb-3">All Users</h2>

    <a th:href="@{/admin-panel/users/new}" class="btn btn-primary mb-3">Add New User</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">john</td>
            <td th:text="${user.fullName}">John Doe</td>
            <td th:text="${user.role}">STUDENT</td>
            <td>
                <a th:href="@{/admin-panel/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/admin-panel/users/delete/{id}(id=${user.id})}"
                   onclick="return confirm('Are you sure you want to delete this user?')"
                   class="btn btn-sm btn-danger ms-1">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/admin-panel}" class="btn btn-secondary mt-3">Back to Admin Panel</a>

</div>
</body>
</html>
