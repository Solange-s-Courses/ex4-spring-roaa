<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Departments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>All Departments</h2>

    <a class="btn btn-success mb-3" th:href="@{/admin-panel/departments/new}">Add New Department</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Syllabus</th>
            <th>Required Credits</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dep : ${departments}">
            <td th:text="${dep.id}">1</td>
            <td th:text="${dep.name}">CS</td>
            <td th:text="${dep.description}">Computer Science</td>
            <td th:text="${dep.requiredCredits}">120</td>
            <td>
                <a class="btn btn-primary btn-sm" th:href="@{/admin-panel/departments/edit/{id}(id=${dep.id})}">Edit</a>
                <a class="btn btn-danger btn-sm"
                   th:href="@{/admin-panel/departments/delete/{id}(id=${dep.id})}"
                   onclick="return confirm('Are you sure you want to delete this department?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-secondary mt-3" th:href="@{/admin-panel}">Back to Admin Panel</a>
</div>
</body>
</html>
