<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Courses</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>Courses Management</h2>

    <a th:href="@{/admin-panel/courses/new}" class="btn btn-success mb-3">Add New Course</a>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Title</th>
            <th>Department</th>
            <th>Credits</th>
            <th>Mandatory</th>
            <th>Syllabus</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.title}"></td>
            <td th:text="${course.department.name}"></td>
            <td th:text="${course.credits}"></td>
            <td th:text="${course.mandatory ? 'Yes' : 'No'}"></td>
            <td th:text="${course.syllabus}"></td>
            <td>
                <a th:href="@{'/admin-panel/courses/edit/' + ${course.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/admin-panel/courses/delete/' + ${course.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this course?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/admin-panel" class="btn btn-secondary mt-3">Back to Admin Panel</a>
</div>
</body>
</html>
