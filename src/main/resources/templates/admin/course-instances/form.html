<!--/*@thymesVar id="courseInstance" type="com.example.ex4.model.CourseInstance"*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Instance Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2 th:text="${courseInstance.id} == null ? 'Add New Course Instance' : 'Edit Course Instance'"> CourseInstance Form</h2>

    <form th:action="@{/admin-panel/course-instances/save}" th:object="${courseInstance}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label  class="form-label">Course:</label>
            <select class="form-select" th:field="*{course}"  required>
                <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.title}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Lecturer:</label>
            <select class="form-select" th:field="*{lecturer}" required>
                <option th:each="lec : ${lecturers}" th:value="${lec.id}" th:text="${lec.fullName}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('lecturer')}" th:errors="*{lecturer}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Year:</label>
            <input type="number" class="form-control" th:field="*{year}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Semester:</label>
            <input type="number" class="form-control" th:field="*{semester}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('semester')}" th:errors="*{semester}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacity:</label>
            <input type="number" class="form-control" th:field="*{capacity}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin-panel/course-instances}" class="btn btn-secondary">Cancel</a>
    </form>

</div>
</body>
</html>
