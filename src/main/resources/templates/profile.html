<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>

</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">


    <h2 class="mb-4 text-center">My Profile</h2>

    <!-- פרטי המשתמש -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">User Info</h5>
            <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
            <p><strong>Full Name:</strong> <span th:text="${user.fullName}"></span></p>
            <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
        </div>
    </div>

    <!-- טופס לשינוי סיסמה -->
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Change Password</h5>
            <form th:action="@{/profile/change-password}" method="post">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Change Password</button>
            </form>
        </div>
    </div>

    <!-- הודעות הצלחה / שגיאה -->
    <div th:if="${success}" class="alert alert-success mt-4" role="alert">
        Password changed successfully!
    </div>
    <div th:if="${error}" class="alert alert-danger mt-4" role="alert">
        <span th:text="${error}"></span>
    </div>

</div>

</body>
</html>
