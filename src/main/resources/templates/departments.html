<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" />
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2 class="mb-4">Departments Overview</h2>

    <div th:each="dept : ${departments}" class="card mb-3">
        <div class="card-header bg-dark text-white">
            <h5 th:text="${dept.name}"></h5>
        </div>
        <div class="card-body">
            <p><strong>Description:</strong> <span th:text="${dept.description}"></span></p>
            <p><strong>Total Required Credits:</strong> <span th:text="${dept.totalCredits}"></span></p>

            <h6>Courses:</h6>
            <ul>
                <li th:each="course : ${departmentCoursesMap[dept.id]}">
                    <span th:text="${course.title}"></span>
                </li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
